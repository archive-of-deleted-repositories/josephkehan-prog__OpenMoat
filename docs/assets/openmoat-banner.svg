    <rect x="2" y="101" width="650" height="3" rx="2" fill="#38bdf8" opacity="0.85"/>
    <text x="2" y="145" fill="#bae6fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" letter-spacing="0.4">ONE GATE · EXPLICIT TRUST · LOCAL CONTROL</text>
