<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">OpenMoat</title>
  <desc id="description">A fortified gate surrounded by a cyan moat with the words OpenMoat, one gate, explicit trust, local control.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
