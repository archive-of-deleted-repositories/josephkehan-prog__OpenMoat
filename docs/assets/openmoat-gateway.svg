    <path d="M51 83 V57 H70 V72 H91 V57 H110 V83 M190 83 V57 H209 V72 H230 V57 H249 V83" fill="#f1f5f9"/>
    <path d="M118 206 V151 C118 133 132 119 150 119 C168 119 182 133 182 151 V206Z" fill="#0b1f33"/>
    <path d="M128 206 V154 C128 142 138 132 150 132 C162 132 172 142 172 154 V206Z" fill="url(#gate)"/>
    <path d="M136 146 H164 M136 159 H164 M136 172 H164 M136 185 H164" stroke="#7c2d12" stroke-width="4" opacity="0.65"/>
    <path d="M150 133 V205" stroke="#7c2d12" stroke-width="4" opacity="0.65"/>
    <circle cx="94" cy="113" r="8" fill="#0b1f33"/>
    <circle cx="206" cy="113" r="8" fill="#0b1f33"/>
    <path d="M42 208 H258" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
    <path d="M109 208 L78 244 M191 208 L222 244" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
