  <g transform="translate(405 45)">
    <text x="0" y="75" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="800" letter-spacing="-4">OPENMOAT</text>
    <rect x="2" y="93" width="690" height="5" rx="2" fill="#22d3ee"/>
    <text x="2" y="137" fill="#e0f2fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">One gate for your local AI tools.</text>
    <text x="2" y="177" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="500">You decide what gets through.</text>
