    <ellipse cx="150" cy="222" rx="142" ry="46" fill="none" stroke="#67e8f9" stroke-width="9"/>
    <ellipse cx="150" cy="222" rx="111" ry="32" fill="#030712" stroke="#22d3ee" stroke-width="3"/>

    <path d="M62 83 H99 V55 H126 V83 H174 V55 H201 V83 H238 V206 H62Z" fill="#e2e8f0"/>
    <path d="M77 101 H223 V206 H77Z" fill="#a8b8ca"/>
